name: Set up locked Common Lisp tools
description: Install pinned mise tools and restore project-local Qlot dependencies.
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: 2026.11.3
    - name: Restore locked Lisp dependencies
      id: qlot
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .qlot
        key: qlot-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions', 'mise.toml', 'qlfile', 'qlfile.lock') }}
    - name: Install locked Lisp dependencies
      if: steps.qlot.outputs.cache-hit != 'true'
      shell: bash
      run: mise run setup
