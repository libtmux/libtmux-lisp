name: Native Lisp checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lisp
      - name: Validate GitHub Actions workflows
        run: /usr/bin/time -p mise run lint-workflows
      - name: Check source and FiveAM unit suite
        run: /usr/bin/time -p mise run check
      - name: Load an isolated package consumer
        run: /usr/bin/time -p mise run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-lisp-package-attempt-${{ github.run_attempt }}
          path: dist/

  integration:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        tmux: ["3.3a", "3.8"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lisp
      - uses: ./.github/actions/build-tmux
        id: tmux
        with:
          version: ${{ matrix.tmux }}
      - name: Check owned tmux fixtures with FiveAM
        env:
          LIBTMUX_TEST_TMUX: ${{ steps.tmux.outputs.binary }}
        run: /usr/bin/time -p mise run integration
      - name: Check shipped examples and tutorial from an isolated archive
        env:
          LIBTMUX_TEST_TMUX: ${{ steps.tmux.outputs.binary }}
        run: /usr/bin/time -p mise run package-examples
      - name: Save the tested tmux build
        if: steps.tmux.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tmux
          key: ${{ steps.tmux.outputs.cache-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-lisp-tmux-${{ matrix.tmux }}-attempt-${{ github.run_attempt }}
          path: |
            build/tmux/provenance/
            build/tmux/logs/
            dist/*-evidence.json
