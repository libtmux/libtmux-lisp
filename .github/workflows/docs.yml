name: docs

# Builds trunk, pull-request and release documentation artifacts. Publication
# requires a manual dispatch with publish enabled. Trunk uses /en/lisp/latest/;
# release tags use their own versions and prereleases also build next.
#
# libtmux/docs builds and publishes the tree through two reusable workflows
# pinned to one commit. Bump both pins together.

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source-ref:
        description: Exact source ref to build
        required: true
        default: master
      version:
        description: URL version slug
        required: true
        default: latest
      version-kind:
        description: Version policy
        required: true
        type: choice
        options: [trunk, tag, alias]
        default: trunk
      is-default:
        description: Make this version canonical
        required: true
        type: boolean
        default: false
      resolves-to:
        description: Immutable target for an alias
        required: false
        default: ''
      publish:
        description: Publish after the exact build passes
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Keep publication and preview cleanup in one queue. The lock covers builds,
# so a closed pull request cannot delete a preview before its build publishes.
concurrency:
  group: docs-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # The shared identity uses github.sha, the tested pull-request merge commit.
  # Fork pull requests build without publishing.
  build:
    uses: libtmux/docs/.github/workflows/port-docs.yml@688f5440fdbf85f7f66004715f8a05d5efdb7473
    with:
      port: lisp
      tag-prefix: ''
      publish-previews: true
      source-ref: ${{ inputs.source-ref }}
      version: ${{ inputs.version }}
      version-kind: ${{ inputs.version-kind }}
      is-default: ${{ inputs.is-default == true }}
      resolves-to: ${{ inputs.resolves-to }}
      publish: ${{ inputs.publish == true }}

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && needs.build.outputs.should-publish == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    uses: libtmux/docs/.github/workflows/reusable-deploy.yml@688f5440fdbf85f7f66004715f8a05d5efdb7473
    with:
      path-prefix: lisp/${{ matrix.version }}
      artifact: docs-lisp-${{ matrix.version }}
      version-kind: ${{ matrix.kind }}
      require-current-pr: true
      port: lisp
      version: ${{ matrix.version }}
      label: ${{ matrix.version }}
      is-default: ${{ matrix.isDefault }}
      resolves-to: ${{ matrix.resolvesTo }}
      environment: ${{ matrix.kind == 'pr' && 'docs-preview' || 'docs' }}
    secrets:
      role-arn: ${{ secrets[matrix.kind == 'pr' && 'LIBTMUX_DOCS_PREVIEW_ROLE_ARN' || 'LIBTMUX_DOCS_ROLE_ARN'] }}
      bucket: ${{ secrets.LIBTMUX_DOCS_BUCKET }}
      distribution: ${{ secrets.LIBTMUX_DOCS_DISTRIBUTION }}
