min_version = "2026.11.3"

[settings]
# Task output stays attached to the caller. This avoids mise's pipe-drain
# grace period and keeps the documented test loops within their budgets.
raw = true

# .tool-versions owns the pins; these tables supply HTTP backend options.
[tools."http:sbcl"]
version = '{{ read_file(path=".tool-versions") | regex_replace(pattern="(?s).*http:sbcl +([0-9.]+).*", rep="$1") }}'
strip_components = 1
bin_path = "."
# Keep the upstream launcher so it resolves its core and contributed modules.
rename_exe = { "run-sbcl.sh" = "sbcl" }
# Qlot respawns the native executable; it must also find the core in SBCL_HOME.
postinstall = { run = 'test -e "$MISE_TOOL_INSTALL_PATH/obj/sbcl-home/sbcl.core" || ln -s ../../output/sbcl.core "$MISE_TOOL_INSTALL_PATH/obj/sbcl-home/sbcl.core"', when = "always" }

[tools."http:sbcl".platforms.linux-x64]
url = "https://prdownloads.sourceforge.net/sbcl/sbcl-{{ version }}-x86-64-linux-binary.tar.bz2"
checksum = "sha256:96e26b0be3aa6ca2a3f03dfd5fc117647fffb96790a9c235e8dcf27df2eba726"

[tools."http:asdf-lisp"]
version = '{{ read_file(path=".tool-versions") | regex_replace(pattern="(?s).*http:asdf-lisp +([0-9.]+).*", rep="$1") }}'
url = "https://asdf.common-lisp.dev/archives/asdf-{{ version }}.lisp"
checksum = "sha256:874e8f235ea633a090c7ab2665b1f624d1910eb7f6fc10349a596085c1cbb189"
bin = "asdf.lisp"

[tools."http:qlot"]
version = '{{ read_file(path=".tool-versions") | regex_replace(pattern="(?s).*http:qlot +([0-9.]+).*", rep="$1") }}'
url = "https://github.com/fukamachi/qlot/releases/download/{{ version }}/qlot-{{ version }}.tar.gz"
checksum = "sha256:1b97df7d7ac3b32f6350d0519a048792f2c4da497d43e6346bbe47e488b50ff4"
strip_components = 1
bin_path = "bin"

[tasks.setup]
description = "Install the locked project-local Lisp dependencies (network)"
run = "qlot install --jobs 2"

[tasks.check]
description = "Run source checks and the unit suite (mid loop)"
run = ["python3 tools/check-source.py", "python3 tools/options-catalog.py", "tools/lisp.sh tools/test.lisp unit query regex json workspace", "tools/lisp.sh tools/documentation.lisp artifact", "python3 tools/check-documentation-artifact.py", "python3 tools/doc-examples.py"]

[tasks.catalogs]
description = "Regenerate native configuration catalogs from committed pinned source facts"
run = "python3 tools/options-catalog.py write"

[tasks.docs]
description = "Regenerate API/field/module references and executable excerpts (no network)"
run = ["tools/lisp.sh tools/documentation.lisp write", "python3 tools/doc-examples.py write"]

[tasks.docs-artifact]
description = "Export and verify the native revision-bound API artifact"
run = ["tools/lisp.sh tools/documentation.lisp artifact", "python3 tools/check-documentation-artifact.py"]

[tasks.unit]
description = "Run local unit tests (inner loop)"
run = "tools/lisp.sh tools/test.lisp unit"

[tasks.query]
description = "Run local native-query tests (inner loop)"
run = "tools/lisp.sh tools/test.lisp query"

[tasks.regex]
description = "Run optional CL-PPCRE query tests (inner loop)"
run = "tools/lisp.sh tools/test.lisp regex"

[tasks.json]
description = "Run optional bounded filter-codec tests (inner loop)"
run = "tools/lisp.sh tools/test.lisp json"

[tasks.workspace]
description = "Run local workspace data and planning tests (inner loop)"
run = "tools/lisp.sh tools/test.lisp workspace"

[tasks.integration]
description = "Run isolated tmux integration tests (outer loop)"
run = ["python3 tools/test-processes.py tools/lisp.sh tools/test.lisp integration", "python3 tools/test-processes.py python3 tests/test-example-cleanup.py"]

[tasks.package]
description = "Build a source archive and verify an isolated core consumer"
run = "python3 tools/package.py"

[tasks.examples]
description = "Run shipped Lisp examples on an owned tmux server (outer loop)"
run = "python3 tools/test-processes.py python3 tools/examples.py"

[tasks.package-examples]
description = "Run the shipped examples from an isolated source archive (outer loop)"
run = "python3 tools/package.py --examples"

[tasks.lint-workflows]
description = "Validate GitHub Actions workflows with pinned actionlint"
run = "actionlint"

[tasks.repl]
description = "Start SBCL with the pinned ASDF release and local system"
run = '''
sbcl \
  --noinform \
  --no-sysinit \
  --no-userinit \
  --load "{{ tools['http:asdf-lisp'].path }}/asdf.lisp" \
  --load .qlot/setup.lisp \
  --eval '(asdf:load-asd (truename "libtmux.asd"))'
'''
